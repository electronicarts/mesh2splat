name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit tests cover CPU-side math only, so they need neither a GPU nor a
  # window server. Running them on all three platforms keeps the conversion
  # honest across compilers (MSVC, libstdc++, libc++).
  tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DMESH2SPLAT_BUILD_APP=OFF -DMESH2SPLAT_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  # Compiles the viewer itself so a change to the export path cannot land
  # without at least one full build of the application.
  build-app:
    name: Build viewer (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install GL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglfw3-dev libglew-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxxf86vm-dev

      - name: Configure
        run: cmake -B build -DMESH2SPLAT_BUILD_APP=ON -DMESH2SPLAT_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 2
